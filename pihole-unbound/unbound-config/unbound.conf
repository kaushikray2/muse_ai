# Unbound recursive DNS resolver
# Full documentation: https://nlnetlabs.nl/documentation/unbound/unbound.conf/

server:
    # --- Network ---
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # --- Access control ---
    # Only answer clients on private LAN ranges. Tighten these to your own
    # subnet(s), e.g. access-control: 192.168.1.0/24 allow
    access-control: 127.0.0.1/32 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # --- DNSSEC validation ---
    # Trust anchor is bootstrapped/updated automatically by the image's
    # entrypoint into var/root.key next to this file on first start.
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
    val-log-level: 1

    # --- Privacy & hardening ---
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    aggressive-nsec: yes

    # --- Performance ---
    num-threads: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    so-rcvbuf: 4m
    so-sndbuf: 4m
    edns-buffer-size: 1232

    # --- Logging ---
    verbosity: 1
    log-queries: no
    log-replies: no

# Example: answer a local name without going upstream (uncomment to use)
# local-zone: "home.arpa." static
# local-data: "router.home.arpa. IN A 192.168.1.1"
