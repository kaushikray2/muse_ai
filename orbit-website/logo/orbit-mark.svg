<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Orbit mark">
  <title>Orbit — Shepard and Nomad</title>
  <!-- Orbit path -->
  <ellipse cx="100" cy="100" rx="78" ry="46" fill="none" stroke="#7DB7A7" stroke-width="7" transform="rotate(-20 100 100)"/>
  <!-- Shepard: central hub -->
  <circle cx="100" cy="100" r="17" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="17" fill="none" stroke="#7DB7A7" stroke-width="3" opacity="0.35"/>
  <!-- Nomad: tracker on the orbit -->
  <circle cx="173.3" cy="98.9" r="11" fill="#7DB7A7"/>
  <circle cx="173.3" cy="98.9" r="16.5" fill="none" stroke="#7DB7A7" stroke-width="2.5" opacity="0.5"/>
</svg>
